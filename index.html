<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Clothing Store</title>
  <link rel="stylesheet" href="MSE2.css">
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="announcement">
    Welcome to our online clothing store
  </div>

  <!-- Header & Navigation Bar -->
  <header>
    <a class="logo" href="#" onclick="goToPage('home'); return false;">College Clothing Store</a>
    
    <nav>
      <a href="#" onclick="goToPage('home'); return false;">Home</a>
      <a href="#" onclick="goToPage('shop'); return false;">Shop</a>
      <a href="#" onclick="openProduct(1); return false;">Product</a>
      <a href="#" onclick="goToPage('wishlist'); return false;">Wishlist <span class="count" id="wish-count"></span></a>
      <a href="#" onclick="goToPage('cart'); return false;">Cart <span class="count" id="cart-count">0</span></a>
      <a href="#" onclick="goToPage('checkout'); return false;">Checkout</a>
      <a href="#" onclick="goToPage('auth'); return false;">Account</a>
    </nav>
  </header>

  <!-- Main Container where JavaScript loads the pages -->
  <main id="app"></main>

  <!-- Page Footer -->
  <footer>
    <p>College E-commerce Project</p>
  </footer>

  <!-- JavaScript file -->
  <script src="MSE2.js"></script>
</body>
</html>
